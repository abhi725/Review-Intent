# Production stack. Routed by the existing Coolify Traefik proxy, using the
# same label conventions as the other services on this box (entrypoints
# http/https, certresolver letsencrypt).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
name: swan-intent-prod

services:
  api:
    image: swan-intent-api:0.13.0
    container_name: swan-intent-api
    restart: unless-stopped
    environment:
      APP_ENV: prod
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.prod}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env.prod}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # Empty default on purpose: access is open, and this only seeds the
      # `allowed_email_domains` setting for the two restricted modes. A value
      # here would quietly become a restriction the day someone changes mode.
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-}
      ACCESS_MODE: ${ACCESS_MODE:-open}
      MONTHLY_SPEND_CAP_USD: ${MONTHLY_SPEND_CAP_USD:-35}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?set MCP_BEARER_TOKEN in .env.prod}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-gemini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      # --- enrichment ---
      # This was set in .env.prod and missing here for a day, which is the worst
      # version of this bug: `organizations/enrich` and the domain resolver both
      # report a missing key as *no result*, so prod looked like "Apollo found
      # nothing for these companies" while it had never been asked. Nothing
      # errored and no alert fired.
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      # Apify residential proxy. Off unless set, because turning it on is what
      # makes Capterra, TrustRadius and SoftwareSuggest billable rather than
      # blocked — see collectors/proxy.py.
      # Public CSV export for Google Sheets. Empty disables the route; a public
      # data path must be switched on deliberately rather than inherited.
      # Google Sheets push. The service account key, base64-encoded.
      # Apollo people/* endpoints. False because every one answers 403 on the
      # free plan; flip after upgrading so the reviewer button reappears.
      APOLLO_PEOPLE_ENABLED: ${APOLLO_PEOPLE_ENABLED:-false}
      GOOGLE_SHEETS_SA_JSON: ${GOOGLE_SHEETS_SA_JSON:-}
      GOOGLE_SHEETS_ID: ${GOOGLE_SHEETS_ID:-}
      SHEET_EXPORT_TOKEN: ${SHEET_EXPORT_TOKEN:-}
      APIFY_RESIDENTIAL_PROXY: ${APIFY_RESIDENTIAL_PROXY:-false}
      APIFY_PROXY_PASSWORD: ${APIFY_PROXY_PASSWORD:-}
      # --- outbound mail ---
      # `:?` rather than a default, deliberately. Every verification and
      # password-reset link is built from this; the config default is
      # http://localhost:8100, so a missing value here would send real people
      # links to their own laptop while everything still returned 200. Better
      # that the deploy refuses to start.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env.prod}
      MAUTIC_URL: ${MAUTIC_URL:-}
      MAUTIC_USER: ${MAUTIC_USER:-}
      MAUTIC_PASS: ${MAUTIC_PASS:-}
      MAUTIC_TPL_VERIFY: ${MAUTIC_TPL_VERIFY:-0}
      MAUTIC_TPL_RESET: ${MAUTIC_TPL_RESET:-0}
      # The floor under Mautic. Keep it set: Mautic's API auth has broken
      # before without anyone noticing, because mail kept arriving this way.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Intent Desk <noreply@updates.swandigitals.com>}
    networks:
      - coolify            # so Traefik can reach it
      - intentdb           # so it can reach Postgres
    labels:
      traefik.enable: "true"
      traefik.docker.network: "coolify"
      traefik.http.routers.intent-http.entrypoints: "http"
      traefik.http.routers.intent-http.rule: "Host(`intent.swandigitals.com`)"
      traefik.http.routers.intent-http.middlewares: "redirect-to-https"
      traefik.http.routers.intent.entrypoints: "https"
      traefik.http.routers.intent.rule: "Host(`intent.swandigitals.com`)"
      traefik.http.routers.intent.tls: "true"
      traefik.http.routers.intent.tls.certresolver: "letsencrypt"
      traefik.http.services.intent.loadbalancer.server.port: "8100"
    deploy:
      resources:
        limits:
          memory: 384M

networks:
  coolify:
    external: true
  intentdb:
    external: true
    name: swan-intent_default
