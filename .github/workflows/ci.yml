name: CI

# The suite is self-contained: no Postgres service and no secrets are needed.
# Tests that would require them skip themselves — test_prod_env_passthrough.py
# skips when .env.prod is absent, which is exactly the CI case.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 3.12 to match the Dockerfile (python:3.12-slim). A newer runner default
      # would test something the image never runs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # `database_url` is the one Settings field with no default, so importing
        # anything that reads config fails without it. That strictness is worth
        # keeping — a wrong default is a worse production failure than a refusal
        # to start — so CI supplies a value rather than the code growing one.
        # Nothing here connects: the suite touches no database.
        env:
          DATABASE_URL: postgresql://intentdesk:ci@127.0.0.1:5432/intentdesk
        run: pytest -q

  dashboard:
    name: dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The API serves web/dist as static files, so a bundle that fails to build
      # is a broken deploy that the Python suite cannot see.
      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build
